# jamn Kit plugin — release pipeline.
#
# Triggered by pushing a tag matching `jamnkit-v*`. Builds the AU +
# VST3 + Standalone via plugin/scripts/package.sh (which picks up the
# Developer ID identities from the keychain automatically), smoke-
# validates the AU with auval, notarizes + staples the .pkg, and
# uploads it to the GitHub Release.
#
# Secrets required (shared with connect-release.yml):
#   APPLE_TEAM_ID                 — 10-char team identifier
#   APPLE_NOTARY_API_KEY_ID       — App Store Connect key ID
#   APPLE_NOTARY_API_ISSUER_ID    — issuer UUID
#   APPLE_NOTARY_API_KEY_P8       — base64-encoded .p8 private key
#   APPLE_CERT_P12                — base64 of the Developer ID Application .p12
#   APPLE_CERT_P12_PASSWORD       — passphrase for the .p12
# Optional (pkg outer signature; without it the pkg is unsigned but
# the stapled notarization still passes Gatekeeper):
#   APPLE_INSTALLER_CERT_P12          — base64 Developer ID Installer .p12
#   APPLE_INSTALLER_CERT_P12_PASSWORD — its passphrase
#
# LICENSING — JUCE 8 Personal tier (free EULA) covers closed-source
# distribution with the splash screen (JUCE_DISPLAY_SPLASH_SCREEN=1 in
# plugin/CMakeLists.txt) up to ~$50k/yr revenue: beta releases are
# CLEAR to tag. Upgrade to Indie to drop the splash or when revenue
# nears the cap (verify current terms at juce.com/legal). Ableton Link
# (GPLv2+) is jam-desktop only — the plugin does not link it.

name: jamnkit-release

on:
  push:
    tags:
      - 'jamnkit-v*'
  # Manual runs build WITHOUT releasing — used to validate the Windows
  # job (and the mac build) before cutting a tag.
  workflow_dispatch:

permissions:
  contents: write  # Release upload

jobs:
  # Windows: VST3 + Standalone for Ableton/any DAW on Windows. The
  # plugin source is JUCE-portable (juce::File everywhere, no Apple
  # APIs); AU in FORMATS is skipped automatically off-macOS. Unsigned
  # zip — SmartScreen will warn on first run, acceptable for testers;
  # Authenticode signing is a later, separate secret.
  windows:
    runs-on: windows-latest
    timeout-minutes: 90  # first run compiles JUCE from scratch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE + build tree
        uses: actions/cache@v4
        with:
          path: plugin/build
          key: jamnkit-build-${{ runner.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      - name: Configure + build (VST3 + Standalone)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          cmake --build plugin/build --config Release --target JamnKit_All -j 4

      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip"
          7z x pluginval.zip -opluginval >/dev/null
          # Strictness 5: scan, instantiate, prepare/process audio+MIDI,
          # parameter fuzz, editor open — the "will a DAW load it" gate,
          # runnable headless. Higher levels add long stress runs.
          ./pluginval/pluginval.exe --strictness-level 5 --validate-in-process \
            --timeout-ms 300000 \
            "plugin/build/JamnKit_artefacts/Release/VST3/jamn Kit.vst3"

      - name: Package zip
        shell: bash
        run: |
          set -euo pipefail
          ART="plugin/build/JamnKit_artefacts/Release"
          mkdir -p plugin/dist/jamnKit-windows
          cp -R "$ART/VST3/jamn Kit.vst3" plugin/dist/jamnKit-windows/
          cp -R "$ART/Standalone/jamn Kit.exe" plugin/dist/jamnKit-windows/ || true
          cat > plugin/dist/jamnKit-windows/README.txt <<'TXT'
          jamn Kit for Windows (VST3 + Standalone)

          Install: copy "jamn Kit.vst3" to C:\Program Files\Common Files\VST3\
          then rescan plugins in your DAW (Ableton: Options > Preferences >
          Plug-Ins > Rescan).

          Unsigned build: Windows SmartScreen may warn on first launch of the
          Standalone — "More info" > "Run anyway".
          TXT
          cd plugin/dist && 7z a "jamnKit-windows.zip" jamnKit-windows

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jamnKit-windows
          path: plugin/dist/jamnKit-windows.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/jamnkit-v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/dist/jamnKit-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/jamnkit-v')
    runs-on: macos-14
    timeout-minutes: 90  # first run compiles JUCE from scratch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache JUCE + build tree
        uses: actions/cache@v4
        with:
          path: plugin/build
          key: jamnkit-build-${{ runner.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      - name: Import Developer ID certificates
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          APPLE_INSTALLER_CERT_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "tmp-pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "tmp-pass" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/dev_id.p12
          security import /tmp/dev_id.p12 -k build.keychain \
            -P "$APPLE_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm /tmp/dev_id.p12

          # Installer cert is optional: package.sh falls back to an
          # unsigned pkg when no "Developer ID Installer" identity
          # exists — notarization + staple still gets it past
          # Gatekeeper.
          if [[ -n "${APPLE_INSTALLER_CERT_P12:-}" ]]; then
            echo "$APPLE_INSTALLER_CERT_P12" | base64 --decode > /tmp/inst_id.p12
            security import /tmp/inst_id.p12 -k build.keychain \
              -P "$APPLE_INSTALLER_CERT_P12_PASSWORD" \
              -T /usr/bin/productbuild -T /usr/bin/productsign \
              -T /usr/bin/security
            rm /tmp/inst_id.p12
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "tmp-pass" build.keychain

      - name: Build + sign + package
        run: |
          set -euo pipefail
          ./plugin/scripts/package.sh
          PKG="$(ls plugin/dist/jamnKit-*.pkg | head -1)"
          echo "PKG_PATH=$PKG" >> "$GITHUB_ENV"

      - name: auval smoke test
        run: |
          set -euo pipefail
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "plugin/build/JamnKit_artefacts/Release/AU/jamn Kit.component" \
            ~/Library/Audio/Plug-Ins/Components/
          # Headless runners register user-dir AUs lazily: kick the
          # registrar, force a full scan with `auval -a`, and retry —
          # first attempts commonly report "didn't find the component".
          for i in 1 2 3 4 5; do
            killall -q AudioComponentRegistrar || true
            auval -a > /dev/null 2>&1 || true
            if auval -v aumu Jkit Jamn; then
              exit 0
            fi
            echo "auval attempt $i failed; rescanning..."
            sleep 10
          done
          echo "::error::AU never validated on the runner"
          exit 1

      - name: Notarize + staple
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          NOTARY_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8_B64" | base64 --decode > /tmp/notary.p8
          xcrun notarytool submit "$PKG_PATH" \
            --key /tmp/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$PKG_PATH"
          rm /tmp/notary.p8

      - name: Stable-named copy for the website's latest-release link
        run: |
          set -euo pipefail
          src=$(ls plugin/dist/jamnKit-*.pkg | head -1)
          cp "$src" plugin/dist/jamnKit-macOS.pkg

      - name: Upload pkg to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin/dist/jamnKit-*.pkg
            plugin/dist/jamnKit-macOS.pkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
