# Jamn (mobile-ios) — TestFlight pipeline.
#
# Triggered by pushing a tag matching `jamn-v*`, or manually via
# workflow_dispatch (beta builds are frequent enough that cutting a tag
# for each one is friction). Generates the Xcode project with XcodeGen,
# archives for a generic iOS device, and exports straight to App Store
# Connect — `destination: upload` in the export options does the upload,
# so there is no separate altool/Transporter step to keep alive.
#
# Nothing ships without a deliberate tag or dispatch: there is no
# push-to-branch trigger here on purpose.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                 — 10-char team identifier (H887LZYZ3M)
#   APPLE_DIST_CERT_P12           — base64 of the *Apple Distribution* .p12
#   APPLE_DIST_CERT_P12_PASSWORD  — passphrase for that .p12
#   APPLE_ASC_KEY_ID              — App Store Connect API key ID
#   APPLE_ASC_ISSUER_ID           — App Store Connect issuer UUID
#   APPLE_ASC_KEY_P8              — base64-encoded .p8 private key
#
# The distribution certificate is NOT the one connect-release.yml uses.
# APPLE_CERT_P12 there holds a *Developer ID* certificate, which signs
# software distributed outside the App Store and cannot sign an App
# Store submission — hence the separate secret.
#
# APPLE_ASC_* may point at the same App Store Connect key as the
# APPLE_NOTARY_API_* secrets IF that key carries the App Manager role.
# A notarization-only key does not, and the upload step will 401.
#
# Prerequisites in App Store Connect, one-time:
#   - An app record exists for com.harvlad.toneforge.mobile.
#   - The API key above has App Manager (or Admin) access.
# Signing assets are resolved by Xcode itself: the project is on
# CODE_SIGN_STYLE Automatic, and -allowProvisioningUpdates with the API
# key lets the runner create/download the App Store provisioning profile
# instead of us shipping profiles through secrets.
#
# Export compliance is pre-answered in project.yml
# (ITSAppUsesNonExemptEncryption: false), so builds go straight to
# testers without the manual questionnaire.
#
# Failure modes are surfaced as job failures — there is no "ship it
# anyway" path, matching connect-release.yml. A build that cannot be
# signed or uploaded must not reach testers half-made.

name: mobile-release

on:
  push:
    tags:
      - 'jamn-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MANDATORY, not tidiness: project.yml's "Stamp build number
          # from git" postBuildScript sets CFBundleVersion from
          # `git rev-list --count HEAD`. On the default shallow clone
          # that count is 1, and App Store Connect rejects a build
          # number that does not exceed the previous one for the same
          # marketing version — every upload after the first would fail.
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd mobile-ios
          xcodegen generate

      - name: Import Apple Distribution certificate
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_DIST_CERT_P12:-}" ]]; then
            echo "::error::APPLE_DIST_CERT_P12 is unset; cannot sign for the App Store"
            exit 1
          fi
          echo "$APPLE_DIST_CERT_P12" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "tmp-pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "tmp-pass" build.keychain
          # Longer than connect-release's hour: an archive of the whole
          # SwiftPM graph plus the upload can outlast a 3600 s timeout,
          # and a re-locked keychain fails signing mid-export.
          security set-keychain-settings -t 7200 -u build.keychain
          security import /tmp/dist.p12 -k build.keychain \
            -P "$APPLE_DIST_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "tmp-pass" build.keychain
          rm /tmp/dist.p12

      - name: Stage App Store Connect API key
        env:
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ASC_KEY_P8:-}" ]]; then
            echo "::error::APPLE_ASC_KEY_P8 is unset; cannot fetch profiles or upload"
            exit 1
          fi
          # xcodebuild's -authenticationKeyPath wants a file. Keep it out
          # of the workspace so no build phase can sweep it into the .app.
          mkdir -p /tmp/asc
          echo "$APPLE_ASC_KEY_P8" | base64 --decode > /tmp/asc/key.p8
          chmod 600 /tmp/asc/key.p8

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cd mobile-ios
          xcodebuild archive \
            -project ToneForgeMobile.xcodeproj \
            -scheme ToneForgeMobileApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Jamn.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/asc/key.p8 \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Report the build number being shipped
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/Jamn.xcarchive/Products/Applications/ToneForgeMobileApp.app/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Uploading Jamn $VERSION ($BUILD)"
          echo "### Jamn $VERSION ($BUILD) → TestFlight" >> "$GITHUB_STEP_SUMMARY"
          # A build number of 1 means the stamp script fell back or ran
          # against a shallow clone — catch it here rather than in a
          # rejected upload ten minutes later.
          if [[ "$BUILD" == "1" ]]; then
            echo "::error::CFBundleVersion is 1 — the git commit-count stamp did not run (shallow clone?)"
            exit 1
          fi

      - name: Export and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <!-- Bitcode is dead since Xcode 14; leaving it on makes
                   the export warn and strip. -->
              <key>compileBitcode</key>
              <false/>
              <!-- TestFlight builds go to internal testers immediately;
                   external groups still gate on beta review. -->
              <key>testFlightInternalTestingOnly</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Jamn.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/asc/key.p8 \
            -authenticationKeyID "$APPLE_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf /tmp/asc
          security delete-keychain build.keychain || true
