name: Build RunPod worker image

# Prebuilt analysis-worker image (ffmpeg + deps + models baked) so a cold RunPod
# pod is claiming jobs in seconds instead of the ~2-3 min bootstrap. Only the
# heavy, slow-changing inputs trigger a rebuild — code is git-pulled at runtime,
# so ordinary code changes do NOT need a new image.
on:
  push:
    branches: [main]
    paths:
      - backend/requirements.txt
      - backend/Dockerfile.worker
      - backend/local_engine/download_models.py
      - .github/workflows/runpod-worker-image.yml
  workflow_dispatch: {}

concurrency:
  group: runpod-worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The runpod/pytorch base + CUDA + models is large; reclaim runner disk
      # (preinstalled toolchains we don't need) before the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tone-forge-worker:latest
            ghcr.io/${{ github.repository_owner }}/tone-forge-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ghcr.io/${{ github.repository_owner }}/tone-forge-worker:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Set RUNPOD_IMAGE to that on the backend to use it (see runpod_autoscaler.py)." >> "$GITHUB_STEP_SUMMARY"
