# PARITY.yaml — cross-platform feature parity matrix. SOURCE OF TRUTH.
#
# Doctrine (enforced by backend/tests/test_platform_parity.py in CI):
# every user-facing feature has one row here, with an explicit status
# per platform. "It shipped on one platform" is not done — it's a row
# with four open cells. Statuses:
#
#   done     — implemented; MUST carry `evidence` (path#symbol). The CI
#              test opens the file and greps the symbol, so renames and
#              deletions break the build instead of silently rotting
#              the matrix.
#   partial  — some of the feature; evidence + note required.
#   missing  — should exist, doesn't yet; note says what's blocking.
#   na       — deliberately not applicable; note says WHY (design
#              decision, platform limitation). "na" without a reason is
#              a missing in disguise.
#
# Platforms:
#   web      — backend/static (jamn.app Jam page)
#   ios      — mobile-ios (ToneForgeMobile app)
#   desktop  — jam-desktop (native macOS Jamn app)
#   plugin   — plugin/ (jamn Kit AU/VST3/Standalone, macOS + Windows)
#   connect  — connect/ (macOS low-latency audio companion)
#
# Adding a feature: add the row FIRST (all platforms filled in), then
# implement. Changing a status to done requires real evidence. The
# point is that gaps are visible decisions, never accidents.

features:
  - id: melody-sequence
    name: Song melody as playable sequence (follow-along / guide)
    platforms:
      web:
        status: done
        evidence: "backend/static/launchpad.js#onMelodyPosition"
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeEngine/Sequencer/MelodySequence.swift#MelodySequencePlayer"
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/SessionController.swift#melodyGuideEnabled"
      plugin:
        status: na
        note: "Sampler plugin plays kit slices; melody guide is a session/transport feature."
      connect:
        status: na
        note: "Connect is a monitoring engine with no song UI."

  - id: drum-kit-pads
    name: Auto drum kit on pads (kind=drums)
    platforms:
      web:
        status: done
        evidence: "backend/static/packs.js#kind=auto|drums"
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeEngine/KitClient.swift#kind"
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktopCore/Launchpad/LaunchpadController.swift#loadChops"
      plugin:
        status: done
        evidence: "plugin/Source/KitPack.cpp#KitPack"
      connect:
        status: na
        note: "No pad surface."

