        note: "No pad surface."

  - id: master-fx-panel
    name: Master FX panel (D-022 — mixer FX tab, 3-band EQ / comp / reverb+delay sends / presets)
    platforms:
      web:
        status: done
        evidence: "backend/static/jam.js#_ensureMasterFXChain"
        note: "WebAudio mirror of MusicBus topology (insert EQ→comp→limiter + send convolver reverb→delay wet/dry→return); same FXSettings ranges + FXPresetCatalog presets; per-song localStorage persistence."
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/Views/FXPanelView.swift#FXPanelView"
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/Perform/FXPanelView.swift#FXPanelView"
      plugin:
        status: na
        note: "Bus FX belong to the host DAW; the sampler stays dry."
      connect:
        status: na
        note: "Master FX color the music bus only — the monitor/guitar path is deliberately untouched (MusicBus contract)."

  - id: remix-transforms
    name: One-tap remix transforms (Re-Drum / Flip / Humanize / Instrument Pack)
    platforms:
      web:
        status: partial
        evidence: "backend/static/remix.js#JamnRemix"
        note: "Remix bar on Jam Pads: Humanize (identical SequencerClock groove math in sequencer.js), Re-Drum (mix stem swap preserving position+mix, pads follow, donor picker, original restore), Instrument Pack (.sfz download). Flip loads the kit and stages defaultSequence into the sequencer store (JamnSequencer.stageDefaultSequence) but does NOT auto-start (no headless sequencer clock on web) and drops per-step probability (web steps are velocity-only)."
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeEngine/RemixClients.swift#RemixClient"
        note: "Includes the web remix bar's applied-confirmation semantics (AppState.remixApplied): every transform states what changed and where to hear it, with a live transport-aware 'Press Play to hear it' on song-mix changes. Flip auto-starts its beat (unlike web/desktop) and the message says so."
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/Sequencer/SequencerPanelView.swift#SequencerPanelView"
        note: "Includes the applied-confirmation line (SessionController.remixApplied), transport-aware via TransportController.isPlaying. Flip does NOT auto-start (no defaultSequence adoption on desktop) — its message points at the pads."
      plugin:
        status: na
        note: "Sampler scope; sequencing lives in the host."
      connect:
        status: na
        note: "No sequencer."

  - id: borrow-loops
    name: Borrow — real loops from other songs as harmonically-matched pads (both songs on one grid)
    platforms:
      web:
        status: done
        evidence: "backend/static/remix.js#applyBorrow"
        note: "Borrow section in the Remix sheet: stem picker (Beat/Bass/Chords), donor list ranked by tempo (drums) or tempo + CONTENT-based harmony (melodic), loads loopable file pads via JamnKit.mountManifest. Backend performance/borrow.py#harmonic_compat scores real shared pitch-class material from both songs' chord ribbons (duration-weighted 12-bin histogram, cosine) refined by circle-of-fifths/relative/parallel key relationship — not just the key label. Loops are cut at musical section boundaries (verse/chorus, downbeat-snapped): THIS song's own sections fill pads 0–7 (blue), the donor's 8–15 (amber, tempo-stretched), so a player jumps between sections of EITHER song on one grid. Pads carry source + sectionType."
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/ToneForgeApp.swift#loadBorrowLoops"
        note: "Borrow section in RemixSheet; SampleBank.autoKit pads with downloaded loop files, bar-synced. Same backend — 16-pad grid mixes this song's sections (0–7) and the donor's (8–15), colour-coded by source colorHint, named by section (Verse/Chorus)."
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/SessionController.swift#loadBorrowLoops"
        note: "Borrow section in RemixSheetView; borrowfile: sentinel routes to ChopPlayer.trigger(file:loop:), launchpad in loop mode. Same backend — both songs' section loops placed sequentially (this song then donor) across the 8×8, colour-coded by source, named by section."
      plugin:
        status: missing
        note: "Plugin has no Remix surface yet; would need a borrow browser + loop-pad playback in the JUCE editor."
      connect:
        status: na
        note: "No pad surface."

