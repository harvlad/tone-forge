  - id: sample-trigger-modes
    name: Sample trigger modes — One-Shot | Follow | Latch (from-the-top gate / clock-joined gate / synced toggle)
    platforms:
      web:
        status: done
        evidence: "backend/static/kit.js#padPressPlan"
        note: "3-way segment (modeBtns One-Shot|Follow|Latch, persisted jamn.kit.mode), decided by the pure padPressPlan/padReleasePlan (padDown/padUp + the hardware Launchpad via lp-hw.js synthetic pointer events all route through them, so a plugged-in Novation gets the identical behavior). One-Shot + Follow are the SAME zero-latency momentary GATE — fire IMMEDIATELY (ignore the quantize axis: no bar-wait, no armed hourglass, even while the transport rolls), FORCE-loop the voice (engine trigger forceLoop → PadEngine.willLoopFor wraps even a non-loopable pad's one-shot into a live releasable voice), and padUp force-stops NOW (padengine release() has no intrinsic-loop guard). They differ ONLY in START PHASE: One-Shot passes forceZeroPhase so the voice starts at the SAMPLE TOP (phase 0) every tap — finger-drumming, retriggers from the beginning; PadEngine.phaseJoinSec returns 0, the web twin of iOS SampleScheduler.forceZeroPhase — while Follow leaves it unset and JOINS the shared clock at its current phase mid-body (phaseJoinSec = (boundary − lockAnchor) mod body) so layered pads lock together. Follow is web's OLD Tap, renamed, behavior preserved. Latch = quantized synced loop, TOGGLE (re-tap releases) — the only mode that rolls the shared clock. Loop removed; a legacy persisted tap/loop value migrates to Follow (migrateTriggerMode, iOS migratedFromLegacy twin); default Follow. A radial per-pad override still outranks the mode in every mode. Ported verbatim from iOS 28fec22e. Pinned by kit.test.mjs (padPressPlan/padReleasePlan + migrateTriggerMode) + padengine.test.mjs (willLoopFor + phaseJoinSec: One-Shot-from-zero vs Follow-joins)."
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/Persistence/JamSettingsStore.swift#SampleTriggerMode"
        note: "JamView sample-mode chips render the 3-way (One-Shot | Follow | Latch, SampleTriggerMode). ModeCoordinator.jamPadUpAction + triggerJamSample are the reference contract web mirrors: One-Shot + Follow are both zero-latency momentary GATES (forceInstantLaunch fires now with no bar-quantize/hourglass; loopOverride force-loops the voice so it sustains while held; padUp force-releases NOW past the intrinsic-loop guard — e8566e69/f081d725/d56dc351/37f851d6), differing ONLY in start phase: One-Shot sets forceZeroPhase so the voice starts at the SAMPLE TOP (phase 0, skips the phaseJoinSeconds lattice join) and retriggers from the beginning each tap, while Follow joins the shared clock phase mid-body so layered pads lock — Follow is the old Tap, renamed, behavior preserved. Latch = quantized synced loop, TOGGLE (re-tap stops) — the only mode that rolls the clock (mode.loops). Loop removed; a legacy persisted tap/loop value → Follow (SampleTriggerMode.migratedFromLegacy), legacy jam.sampleLatch Bool → latch/follow; default Follow (28fec22e). Pinned by SampleTriggerModeTests + PadPhaseLockTests + JamSettingsStoreTests."
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktopCore/Launchpad/LaunchpadController.swift#PadPlaybackMode"
        note: "3-way PadPlaybackMode { oneShot, follow, latch } — One-Shot | Follow | Latch (playbackModePicker segment; LaunchpadPanelView), ported verbatim from iOS 28fec22e. One-Shot = finger-drumming GATE — fires NOW ignoring quantize/lock even while rolling, FROM THE SAMPLE TOP (padDown `instant` branch forces lockPhaseSeconds = 0 via startsFromZero, iOS forceZeroPhase twin), loops-while-held, stops on finger-lift, retriggers from the top each tap. Follow = the same zero-latency gate but JOINS the shared lattice at its current phase mid-body (lockPhaseSeconds = now − era anchor, iOS forceInstantLaunch twin) so layered pads lock — desktop's ORIGINAL `tap`, renamed, behavior preserved. Both gates stop on padUp (releases when !isToggle) and force-loop the voice (all three loop). Latch = quantized TOGGLE (re-tap in padDown stops; padUp no-op) — the only mode that quantizes / drives the shared grid (quantizesLaunch). Loop removed; a legacy persisted tap/loop raw value migrates to Follow (PadPlaybackMode.migratedFromLegacy); default Follow. Desktop's ChopPlayer.release keys on the sounding voice, never on intrinsic loop flags, so the gate force-stops a non-loopable looping voice with no `force` flag (iOS e8566e69 had to add one). Hardware Launchpad (USBLaunchpadTransport) routes note-on/note-off through the SAME mode-aware padDown/padUp (attach() wires onPadDown/onPadUp), so a plugged-in device gets the identical One-Shot from-the-top gate + Follow join + Latch toggle. Pinned by LaunchpadControllerTests (Follow-fires-now-not-quantized, OneShot-starts-from-zero-while-Follow-joins, gate-hold-to-play, Latch-toggles, enum-contract, legacy-migration) + ChopPlayerFileReleaseTests (gate force-release). Deliberate iOS/desktop gate deviation from web (which quantizes tap)."
      plugin:
        status: na
        note: "jamn Kit is a fixed 16-voice sampler with no launchpad session-clip trigger surface — 8×8 + One-Shot/Follow/Latch clip semantics are a jam-app concept, not a sampler one (same rationale as launchpad-pad-grid)."
      connect:
        status: na
        note: "No pad surface."

  - id: launchpad-edit-mode
    name: Launchpad Edit mode — zero-latency pads by default, hold-radial behind an Edit toggle
    platforms:
      web:
        status: done
        evidence: "backend/static/kit.js#setEditMode"
        note: "What web actually armed pre-fix: EVERY primary pointerdown set a 450 ms long-press timer whose firing called padUp (releasing the held voice) then opened the radial — the same hold-hijack iOS 602a9043 fixed, live on both mouse and touch — plus contextmenu → radial. Now: pencil Edit chip beside the 16|64/quantize chips (kit-toggle pattern), persisted jamn.kit.edit (jamn.kit.pads pattern), default OFF. Edit OFF arms NO timer on pointerdown (zero recognition tax; pointermove tracking already no-ops when no timer exists) and right-click opens nothing; the browser context menu stays suppressed in both modes so a touch long-press can't pop selection UI mid-performance. Edit ON = CONFIGURE not perform: a pad touch never calls padDown/sounds the pad, it only arms the hold-radial (fixes the user report that holding to open the radial 'fires the pad on and off' — the old flow sounded it on press then padUp'd it on the 450 ms fire, an audible blip); a quick tap in Edit mode is silent too (the radial itself auditions). HONEST DEVIATION: web has no empty-pad Add Sound to preserve — empty tiles are disabled buttons (kit.js buildPadTile); adding sounds on web lives in header chrome (+ Add from another song / chop Load / radial Add sound), which the toggle does not gate."
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/Views/Jam/JamView.swift#launchpadEditChip"
        note: "SEMANTIC: Edit OFF (the default) means ZERO gesture-recognition tax on pad touch-down — PadTouchUIView arms no long-press timer at all when no hold consumer exists, so a hold sustains instead of being hijacked (voice-cut + radial) at 0.5 s. It is NOT merely a hidden menu. Edit ON restores the hold-radial (Add Sound / Chop / Loop / Effects / Sequence / Delete). Empty-pad tap still opens Add Sound in both modes (not a performance path). The 64-grid and borrow pads share the SamplePadGrid4x4 tile component, so the rule covers them."
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/Launchpad/LaunchpadPanelView.swift#launchpadEditChip"
        note: "Pencil Edit chip on the panel header, persisted (jam.launchpad.editMode), default OFF. Edit OFF = pure performance pads: right-click radial, hover ⋯ hint, move mode and clear-all are all disarmed (LaunchpadController.editAffordanceEnabled, test-pinned); Edit ON restores them. Empty-pad click still opens Add Sound in both modes. SEMANTIC NOTE: desktop never had a hold timer (right-click is its edit gesture), so unlike iOS there was no voice-cut bug to fix — this row is the surface-contract half of the parity (edit gestures disarmed by default), not a latency fix."
      plugin:
        status: na
        note: "JUCE pad surface has no radial editing to gate."
      connect:
        status: na
        note: "No pad surface."

