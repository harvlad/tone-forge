        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/Views/SamplePadGrid4x4.swift#SamplePadGrid4x4"
        note: "Native surfaces are the reference these web modules mirror."
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/Launchpad/LaunchpadPanelView.swift#LaunchpadPanelView"
