      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktopCore/Launchpad/LaunchpadControlSurface.swift#LaunchpadControlSurface"
        note: "Full approved map (D-036): CC20 play/pause + CC10 global stop kept; CC30/40/50 One-Shot|Follow|Latch select; Clear(60) loop-lock; ◄►(91/92) 16/64 size; Session(93) sequencer panel; Chord(95) Instant Groove; Record Arm(1) take-record toggle (red pulse while recording); Stop Clip(8) stop-all-pads with amber press flash; Mute…Device(2–7) per-category layer toggles; track select(101–108) pattern select; scene arrows 89 = sequencer play/stop, 79–19 = section blocks (lit/pulse, press = SectionStripView.onSeek path). LEDs via ControlButtonLightTransport (own controlLedCache, PadIndex.isValid bypass, reconnect redraw). Tap tempo parked; Shift reserved. Pinned by LaunchpadControlSurfaceTests + USBLaunchpadTransportTests."
