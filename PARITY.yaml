      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/Launchpad/MIDIKeyboardTransport.swift#mappedPads"
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktopCore/Launchpad/MIDIKeyboardTransport.swift#mappedPads"
      plugin:
        status: done
        evidence: "plugin/Source/PluginProcessor.cpp#finishMidiLearn"
        note: "Deliberate deviation from the ios/web drop rule: unmapped notes fall back to the fixed kFirstNote (C1) layout instead of being dropped — the fixed layout is the plugin's documented default and DAW users rely on it (learned entries still win; learn capture consumes note-ons)."
      connect:
        status: na
        note: "No pad surface."

  - id: midi-keyboard-synth
    name: Generic MIDI keyboard plays the synth
    platforms:
      web:
        status: done
        evidence: "backend/static/launchpad.js#onGenericNote"
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/Launchpad/MIDIKeyboardTransport.swift#NoteRouting"
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/SessionController.swift#midiKeyboard"
      plugin:
