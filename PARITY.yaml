  - id: midi-clock-out
    name: MIDI clock output (24 PPQN + start/stop) for external gear
    platforms:
      web:
        status: done
        evidence: "backend/static/launchpad.js#startMidiClock"
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/SettingsView.swift#midiClockOut"
      desktop:
