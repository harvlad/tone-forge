  - id: ableton-link
    name: Ableton Link tempo sync
    platforms:
      web:
        status: partial
        evidence: "backend/static/jam.js#_linkRate"
        note: "Follow-only via native helper relay (tools/jamn-link-helper); relay-grade accuracy; licensing review pending before public."
      ios:
        status: missing
        note: "Blocked on the Ableton LinkKit license agreement (OUTSTANDING.md); LinkKit is the iOS-specific SDK and requires signing terms before integration — deliberate hold, not forgotten."
      desktop:
        status: partial
        evidence: "jam-desktop/Sources/JamDesktop/LinkSync.swift#LinkSync"
        note: "Follow-only V1."
      plugin:
        status: na
        note: "DAW host owns tempo/Link."
      connect:
        status: missing
        note: "Natural long-term Link bridge for web, but tools/jamn-link-helper covers the relay for internal testing; revisit only if the helper's Python dependency or accuracy becomes a problem. Same licensing gate as iOS."

  - id: live-library
    name: Library list live-updates (new songs + in-flight analyses)
    platforms:
      web:
        status: done
        evidence: "backend/static/jam.js#followJob"
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeMobile/RootView.swift#refreshJobs"
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktopCore/Intake/AnalysisQueueModel.swift#onJobCompleted"
        note: "In-flight analyses live via followJob SSE (progress + completion, reattach-on-drop); job completion + scene-active now refresh the Recent-songs history list (RootView onJobCompleted / scenePhase). Verified 2026-09-08: swift build clean."
      plugin:
        status: done
        evidence: "plugin/Source/PluginEditor.cpp#browseBackend"
        note: "Browse re-fetches /api/history?scope=mine live on every open (no caching) — a song analyzed on any other surface appears on the next Browse click. Verified 2026-09-08. The list is a transient PopupMenu, so it can't self-update while open; the plugin is a kit CONSUMER with no analysis queue of its own, so there are no in-flight jobs to track. A persistent auto-polling panel is possible but low-value in a plugin editor."
      connect:
        status: na
        note: "No library UI."

  - id: launchpad-mk3
    name: Novation Launchpad Pro MK3 grid (pads + LEDs)
    platforms:
      web:
        status: done
        evidence: "backend/static/launchpad.js#SYSEX_ENTER_PROGRAMMER"
      ios:
