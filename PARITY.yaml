        evidence: "mobile-ios/Sources/ToneForgeMobile/Launchpad/USBLaunchpadTransport.swift#USBLaunchpadTransport"
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/SessionController.swift#usbLaunchpad"
      plugin:
        status: na
        note: "Host/DAW territory."
      connect:
