  - id: borrow-loops
    name: Borrow — real loops from other songs as harmonically-matched pads (both songs on one grid)
    platforms:
      web:
        status: done
        evidence: "backend/static/remix.js#applyBorrow"
        note: "Borrow section in the Remix sheet: stem picker (Beat/Bass/Chords), donor list ranked by tempo (drums) or tempo + CONTENT-based harmony (melodic), loads loopable file pads via JamnKit.mountManifest. Backend performance/borrow.py#harmonic_compat scores real shared pitch-class material from both songs' chord ribbons (duration-weighted 12-bin histogram, cosine) refined by circle-of-fifths/relative/parallel key relationship — not just the key label. Loops are cut at musical section boundaries (verse/chorus, downbeat-snapped): the picked stem leads (this song's sections 0–7 blue, donor 8–15 amber) so a 16-pad grid shows both songs; the remaining stems (drums/bass/chords/vocals) fill the rest of the 8×8 as both songs' FULL kits (32 blue + 32 donor), this song unstretched, donor tempo-stretched. Pads carry source + sectionType and are named '<Stem> <Section>'. Underwater fix: pad reverb is dry by default (was 0.3 wet on iOS)."
      ios:
        status: done
        evidence: "mobile-ios/Sources/ToneForgeEngine/SampleBank.swift#arrangeBorrowLayout"
        note: "Borrow section in RemixSheet / BorrowPickerSheet; SampleBank.autoKit pads with downloaded loop files, bar-synced. Now web-parity layout (D-029): loadBorrowLoops runs the manifest through SampleBank.arrangeBorrowLayout (Swift twin of kit.js#arrangeBorrowLayout) — current song's loops on the TOP rows, a BLANK divider row, donor's loops below (row-major, 8 wide); a full 4-stem borrow (32+32) drops the divider to fit; grid stays 64. Each pad shows a small SOURCE-SONG label (current song title vs donor name via borrowDonorName) plus the blue(#3B82F6)/amber(#F59E0B) tint. SamplePad gains source+sourceName; PadVisual/PadContent gain sourceLabel; ModeCoordinator+Layout paints borrow packs full 8×8 top-origin; ModeGridView draws the source line top-left. Pinned by BorrowLayoutTests."
      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktop/SessionController.swift#loadBorrowLoops"
        note: "Borrow section in RemixSheetView; borrowfile: sentinel routes to ChopPlayer.trigger(file:loop:), launchpad in loop mode. Same backend — both songs' section loops placed sequentially (this song then donor) across the 8×8, colour-coded by source, named by section."
      plugin:
        status: missing
        note: "Plugin has no Remix surface yet; would need a borrow browser + loop-pad playback in the JUCE editor."
      connect:
        status: na
        note: "No pad surface."

