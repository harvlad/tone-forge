      desktop:
        status: done
        evidence: "jam-desktop/Sources/JamDesktopCore/Launchpad/MIDIKeyboardTransport.swift#mappedPads"
      plugin:
        status: missing
        note: "Fixed note-36 layout; in-DAW remapping covers hosted use, standalone needs learn."
      connect:
        status: na
        note: "No pad surface."

  - id: midi-keyboard-synth
