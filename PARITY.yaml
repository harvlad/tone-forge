        note: "iOS is the REFERENCE master-FX graph — MixerView [Levels|FX] hosts FXPanelBody (3-band EQ, compressor, reverb/delay sends, FX return, presets); desktop MusicBus + web are documented 1:1 ports of it. Verified 2026-09-08."
