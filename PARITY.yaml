  - id: launchpad-mk3-function-buttons
    name: "Launchpad Pro MK3 function-button map — the buttons AROUND the grid drive the session (transport, trigger mode, loop lock, grid size, record, stop-clip, section jump, layer toggles, sequencer panel/play/pattern select) with state LEDs"
    platforms:
      web:
        status: partial
        evidence: "backend/static/lp-hw.js#ccFunction"
        note: "Full D-036 map ported into lp-hw.js while the Samples/Sequencer surface owns the device (jam.js CC handler defers there): CC20/10 transport via JamnKitHost; 30/40/50 mode select; 60 loop-lock = shared quantize off↔last grid; 91/92 = kit setPadCount 16/64; 93 Session toggles the Sequencer VIEW; 95 Groove (empty-grid inert, amber flash); 1 take record (JamnRecordings.toggleRecord, red pulse — web recorder has no distinct armed stage); 2-7 layer toggles (kit hw.toggleLayer, category-accent LEDs); 8 stop-all-pads (amber flash); 101-108 pattern select + 89 sequencer play/stop (4 slots A-D, act only while the sequencer pane is mounted — no headless clock on web); 79-19 section jumps via new JamnKitHost.seek (strip made clickable to match). Control LEDs: separate cache/blank domain (CTL_CCS), reconnect repaint, software pulse; CC20 LED stays with the driver's play painter (spray trimmed to the confirmed CC20). Receive-thread fast press is a browser ceiling (WebMIDI = main thread) — na, not fixable. Pinned by lp-hw.test.mjs."
      ios:
        status: partial
        evidence: "mobile-ios/Sources/ToneForgeMobile/Launchpad/LaunchpadControlSurface.swift#LaunchpadControlSurface"
        note: "The CC → function ASSIGNMENT is now a shared engine table (ToneForgeEngine LaunchpadControlMapping — identical to desktop's D-036 map, pinned by LaunchpadControlMappingTests) consumed by the iOS host surface. Mapped: CC20 play/pause + CC10 global stop (AppState.stopEverything: pause + sequences + pads); CC30/40/50 One-Shot|Follow|Latch (writes jamSettings.sampleTriggerMode, the SAME store the on-screen chips use); Clear(60) loop-lock; ◄►(91/92) 16/64 incl. the borrow relayout the on-screen chips do; Session(93) opens/closes the Contribute sequencer panel via AppState.sequencerPanelOpen — the SAME showSequencer state the on-screen chip drives (desktop's onSequencerPanelToggle/isSequencerPanelOpen seam, D-039), LED lit while open; sequencer play(89) starts/stops that panel's preview loop (SequencerTabView registers its SequencerPlayer on AppState.activeSequencerPlayer while on screen; toggleSequencerPreview → play(sync:false)/stop), LED pulses while playing — reachable while the panel is open (accepted iOS constraint); Chord(95) Instant Groove (inert on an empty grid, amber flash); Record Arm(1) = the session OUTPUT recorder toggle — iOS has no armed state, LED is dim red ↔ red pulse; Stop Clip(8) stop-all-pads with amber flash; Mute…Device(2–7) kit-category layer toggles (DRUMS/BASS/CHORDS/SYNTH/LEAD/TEXTURE, best-pad start via the Instant-Groove selection rule); scene 79–19 section jumps through selectSection (section-strip semantics incl. lock-follow). PARTIAL only because pattern select (101–108) is `na` on iOS: there is no pattern-SLOT model (desktop's A–D grid) — the Sequence Builder records ONE pad sequence, so those keys stay genuinely inert + dark (never a different meaning). Control LEDs ride the desktop seam port (USBLaunchpadTransport.setControlLights: own controlLedCache, PadIndex.isValid bypass with the inverse grid-address gate, reconnect redraw), repainted at 10 Hz off the existing hardware timer. Pinned by LaunchpadControlSurfaceTests +